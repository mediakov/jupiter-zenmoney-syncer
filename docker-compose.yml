services:
  syncer:
    build: .
    restart: unless-stopped
    # bind to loopback only — reachable from this Mac, not the LAN
    ports:
      - "127.0.0.1:8080:8080"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      # All optional — every email and the ZenMoney token can also be set from the UI.
      # Set either card, or both: an unconfigured card is simply skipped.
      JUP_EMAIL: ${JUP_EMAIL:-}
      PLASMA_EMAIL: ${PLASMA_EMAIL:-}
      # Comma list of cards to run, e.g. "plasma" for Plasma-only. Unset = both.
      SYNC_PROVIDERS: ${SYNC_PROVIDERS:-}
      ZEN_TOKEN: ${ZEN_TOKEN:-}
      SYNC_INTERVAL: ${SYNC_INTERVAL:-6h}
      SYNC_YEARS: ${SYNC_YEARS:-}
      DRY_RUN: ${DRY_RUN:-}
      SERVICE_TOKEN: ${SERVICE_TOKEN:-}
      SOLANA_RPC: ${SOLANA_RPC:-}
    volumes:
      - jup-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 2m
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  jup-data:
